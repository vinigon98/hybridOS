[package]
name = "hybctl"
version = "1.0.0"
edition = "2021"
description = "Controlador Central de Configuracao do Sistema Hybridos OS (hybctl)"

[[bin]]
name = "hybctl"
path = "src/main.rs"

[dependencies]
libhybrid_sys = { path = "../../libhybrid_sys" }

[profile.release]
opt-level = 3
panic = "abort"
