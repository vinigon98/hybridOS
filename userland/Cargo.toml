[workspace]
members = [
    "libhybrid_sys",
    "apps/hybrid_sh",
    # Binarios 83-100 — Agente 5
    "apps/hyb-net-adapters",
    "apps/hyb-shares",
    "apps/ip",
    "apps/hyb-ip",
    "apps/ping",
    "apps/hyb-mtr",
    "apps/traceroute",
    "apps/hyb-ports",
    "apps/dig",
    "apps/hyb-dns",
    "apps/hyb-netctl",
    "apps/hyb-lan-scan",
    "apps/hyb-route",
    "apps/hyb-mac",
    "apps/hyb-mount-net",
    "apps/hyb-tcp-test",
    "apps/hyb-hosts",
    "apps/hyb-proxy",
    "apps/hyb-bt",
