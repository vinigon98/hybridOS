# /etc/hybridos/system.toml — Configuração Base do Hybridos OS
#
# Arquivo mestre de configuração declarativa. Gerido pelo utilitário `hybctl`
# e exposto graficamente pelo `hyb-settings`. Todos os 100 módulos de
# configuração (~1.000 parâmetros) residem em /etc/hybridos/; este arquivo
# contempla os Módulos 1 a 10 (100 parâmetros).
#
# Formato: TOML. Chaves são acessíveis por `hybctl` através do nome pontuado:
#   hybctl get display.refresh_rate
#   hybctl set input.mouse.raw_input true
#
# Valores otimizados por padrão para produtividade e performance (conforme a
# Especificação Arquitetural do Hybridos OS).

# ============================================================
# Módulo 1 — Compositor de Vídeo, Monitores e Pipeline Gráfico (12)
# ============================================================

[display]
refresh_rate = 144
scaling = "100%"
multi_monitor = true
night_light = false
hdr_pipeline = true
disable_cabc = true

[graphics]
scheduler_hags = true
direct_scanout = true
gpu_preference = "hybrid"
tdr_recovery = true
legacy_dpi_fix = true
frame_limiter_global = 0

# ============================================================
# Módulo 2 — Subsistema de Áudio Pro-Audio e Gamer (8)
# ============================================================

[audio]
devices_profile = "auto"
bit_perfect = true
quantum_buffer = 128
lock_mic_gain = true
ducking = false
rnnoise_filter = false
per_app_routing = true
system_sounds = false

# ============================================================
# Módulo 3 — Input de Latência Zero: Mouse, Teclado e Periféricos (10)
# ============================================================

[input.mouse]
raw_input = true
polling_rate_support = 1000
scroll_inactive = true
middle_click_paste = false

[input.keyboard]
repeat_rate = 35
no_sticky_keys = true
remap_caps = "default"
clean_layout = true

[input.touchpad]
gestures = true

[input.usb]
no_autosuspend = true

# ============================================================
# Módulo 4 — Gerenciamento de Energia, Agendador de CPU e Térmicas (8)
# ============================================================

[power]
profile = "balanced"
pcie_aspm = false
cpu_scheduler = "topology_aware"
boost_control = true
clean_shutdown = true
hibernation = false
battery_charge_limit = 80
disk_spindown = false

# ============================================================
# Módulo 5 — Shell Gráfico, Janelas e Explorador de Arquivos (14)
# ============================================================

[files]
show_extensions = true
show_dotfiles = false
default_view = "home"
zero_ads = true
header_path = true

[shell]
context_menu = "classic_full"
taskbar_clean = true
panel_position = "bottom"
force_kill_shortcut = true
launcher = "super_space"
window_tiling = false
virtual_desktops = true
compositor_effects = true
tray_telemetry = false

# ============================================================
# Módulo 6 — Ambiente de Desenvolvimento, Sistema de Arquivos e Memória (13)
# ============================================================

[developer]
mode_default = true
localhost_domains = true

[fs]
unlimited_paths = true
case_sensitivity_per_dir = true
dev_optimization = true

[security]
dev_trust_folders = true

[locale]
utf8_everywhere = true
technical_formats = true

[env]
session_reload = true

[memory]
zram_swap = true

[virt]
dynamic_memory = true
port_auto_bind = true

[storage]
temp_tmpfs = true

# ============================================================
# Módulo 7 — Modo Gamer de Kernel e Priorização de Tempo Real (8)
# ============================================================

[system]
hostname = "hyb-workstation"
startup_sandbox = true
background_freeze = true

[gaming]
kernel_boost = true
replay_buffer_ram = true
fullscreen_silence = true
hvci_toggle_per_boot = false
shader_cache_manager = true
overlay_minimal = true

# ============================================================
# Módulo 8 — Pilha de Rede de Baixa Latência, DNS e Segurança (11)
# ============================================================

[net]
dns_encrypted = true
congestion_control_bbr = true
nic_low_latency = true
qos_gaming_voip = true
ipv6_privacy = true
zero_config_share = true
ntp_high_precision = true
wifi_band_steering = true
no_p2p_updates = true
wireguard_native = true
dev_firewall_profiles = true

# ============================================================
# Módulo 9 — Privacidade Absoluta e Soberania do Usuário (9)
# ============================================================

[privacy]
zero_telemetry = true
no_ad_id = true
offline_search_only = true
smart_indexer = true
hardware_kill_switches = true
clipboard_guard = true
no_nag_screens = true
no_silent_installs = true
clean_uninstall = true

# ============================================================
# Módulo 10 — Atualizações Sob Controle, Imutabilidade e Portabilidade (7)
# ============================================================

[update]
manual_or_scheduled = true
driver_pinning = true
channel_selection = "lts"